<!-- @dsCard group="Slides" viewport="1920x1080" name="Deck — click through all nine frames" subtitle="Arrow keys or click the edges; footer keeps day + slide number" -->
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../_ds_bundle.js"></script><style>html,body{margin:0;background:#0C1730;overflow:hidden}#stage{position:fixed;inset:0;display:grid;place-items:center;padding-bottom:90px;box-sizing:border-box}#fit{overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.45)}#scaler{width:1920px;height:1080px;transform-origin:top right}.nav{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);display:flex;gap:10px;align-items:center;z-index:5;background:rgba(255,255,255,.94);border-radius:999px;padding:8px 14px;font-family:var(--font-arabic);box-shadow:0 2px 6px rgba(0,0,0,.3)}.nav button{font:600 15px var(--font-arabic);border:1px solid var(--brand-snow-line);background:#fff;color:var(--brand-primary);border-radius:999px;padding:7px 14px;cursor:pointer}.nav button:hover{background:var(--brand-sky-soft)}.nav button:active{background:var(--brand-sky);color:#fff}.nav code{font:400 13px var(--font-mono);color:var(--brand-ink);direction:ltr}</style></head><body><div id="stage"><div id="fit"><div id="scaler"></div></div></div><div class="nav" id="nav"></div><script type="text/babel" src="deck.data.js"></script><script type="text/babel">window.SAG_ON_SLIDES = function () {const slides = window.SAG_SLIDES; let i = 0;const root = ReactDOM.createRoot(document.getElementById("scaler"));const nav = document.getElementById("nav");function fit(){const k=Math.max(0.05,Math.min(innerWidth/1920,(innerHeight-90)/1080));const box=document.getElementById("fit");box.style.width=(1920*k)+"px";box.style.height=(1080*k)+"px";document.getElementById("scaler").style.transform="scale("+k+")";}function draw(){root.render(slides[i].el());nav.innerHTML="";const prev=document.createElement("button");prev.textContent="السابق";prev.onclick=function(){go(-1)};const next=document.createElement("button");next.textContent="التالي";next.onclick=function(){go(1)};const lab=document.createElement("code");lab.textContent=slides[i].label+"  "+(i+1)+" / "+slides.length;nav.appendChild(next);nav.appendChild(lab);nav.appendChild(prev);}function go(d){i=(i+d+slides.length)%slides.length;draw();}addEventListener("keydown",function(e){if(e.key==="ArrowLeft")go(1);if(e.key==="ArrowRight")go(-1);});addEventListener("resize",fit);addEventListener("load",fit);requestAnimationFrame(fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(document.documentElement);fit();draw();};if (window.SAG_SLIDES) window.SAG_ON_SLIDES();</script></body></html>
