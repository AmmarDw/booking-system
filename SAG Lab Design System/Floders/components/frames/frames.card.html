<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>html,body{margin:0;background:#EFF2F7;font-family:var(--font-arabic)}body{padding:22px;box-sizing:border-box;width:1400px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cell{display:flex;flex-direction:column;gap:6px}.mini{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;box-shadow:0 2px 6px rgba(20,36,71,.18);background:#fff}.mini>div{width:1920px;height:1080px;transform:scale(0.2286);transform-origin:top right}.cap{font:600 14px var(--font-mono);color:#5b6580;direction:ltr;text-align:left}</style></head><body><div id="root"></div><script type="text/babel" src="../../slides/deck.data.js"></script><script type="text/babel">window.SAG_ON_SLIDES = function () {function Grid() { return (<div className="grid">{window.SAG_SLIDES.map(function (s) {return (<div className="cell" key={s.id}><div className="mini"><div>{s.el()}</div></div><span className="cap">{s.label}</span></div>);})}</div>); }ReactDOM.createRoot(document.getElementById("root")).render(<Grid />); };if (window.SAG_SLIDES) window.SAG_ON_SLIDES();</script></body></html>
