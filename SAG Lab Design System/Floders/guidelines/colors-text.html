<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--brand-white);font-family:var(--font-arabic);color:var(--brand-ink)}body{padding:18px;box-sizing:border-box}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:10px;padding:10px 12px;min-width:132px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;height:104px}.sw b{font:600 15px/1.2 var(--font-arabic)}.sw code{font:400 12px/1.2 var(--font-mono);direction:ltr;opacity:.85}.row{display:flex;gap:14px;align-items:baseline}.lab{font:400 12px/1 var(--font-mono);color:#7c869b;direction:ltr}</style></head><body><div class="g"><div class="sw" style="background:#fff;border:1px solid var(--brand-snow-line);height:120px;min-width:210px"><b style="color:var(--brand-primary);font-size:22px">عنوان الشريحة</b><span style="color:var(--brand-ink);font-size:17px">نص الجسم — ink بكامل التعتيم</span><code>ink on white · 8.6:1</code></div><div class="sw" style="background:var(--brand-deep);height:120px;min-width:210px"><b style="color:#fff;font-size:22px">عنوان الشريحة</b><span style="color:#DCE3F0;font-size:17px">نص الجسم على السطح الداكن</span><code style="color:#fff">white on deep · 14:1</code></div><div class="sw" style="background:#fff;border:1px dashed #C9345A;height:120px;min-width:150px"><b style="color:#9AA3B4;font-size:20px">ممنوع</b><span style="color:#9AA3B4;font-size:15px">رمادي فاتح على أبيض</span><code style="color:#C9345A">projector eats this</code></div></div></body></html>
