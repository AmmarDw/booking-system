<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--brand-white);font-family:var(--font-arabic);color:var(--brand-ink)}body{padding:18px;box-sizing:border-box}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:10px;padding:10px 12px;min-width:132px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;height:104px}.sw b{font:600 15px/1.2 var(--font-arabic)}.sw code{font:400 12px/1.2 var(--font-mono);direction:ltr;opacity:.85}.row{display:flex;gap:14px;align-items:baseline}.lab{font:400 12px/1 var(--font-mono);color:#7c869b;direction:ltr}</style></head><body><div class="g"><div class="sw" style="background:var(--brand-white);border:1px solid var(--brand-snow-line)"><b>brand-white</b><code>#FFFFFF</code></div><div class="sw" style="background:var(--brand-snow);border:1px solid var(--brand-snow-line)"><b>brand-snow</b><code>#EEF2F8</code></div><div class="sw" style="background:var(--brand-deep);color:#fff"><b>surface-slide-dark</b><code>#142447</code></div><div class="sw" style="background:#1B2E56;color:#fff"><b>card on dark</b><code>#1B2E56</code></div></div></body></html>
