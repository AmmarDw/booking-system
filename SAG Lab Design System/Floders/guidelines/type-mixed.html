<!-- @dsCard group="Type" viewport="700x180" name="Arabic + Latin in one line" subtitle="Wrap every Latin fragment so it cannot reorder the line" -->
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--brand-white);font-family:var(--font-arabic);color:var(--brand-ink)}body{padding:18px;box-sizing:border-box}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:10px;padding:10px 12px;min-width:132px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;height:104px}.sw b{font:600 15px/1.2 var(--font-arabic)}.sw code{font:400 12px/1.2 var(--font-mono);direction:ltr;opacity:.85}.row{display:flex;gap:14px;align-items:baseline}.lab{font:400 12px/1 var(--font-mono);color:#7c869b;direction:ltr}</style></head><body><div style="display:flex;flex-direction:column;gap:12px"><div><div class="lab">.tok-lat + .tok-code</div><div style="font:400 23px/1.75 var(--font-arabic)">افتح <span class="tok-lat">Claude Code</span> من مجلد المشروع ثم شغّل <span class="tok-code">/init</span> لقراءة المستودع.</div></div><div><div class="lab">unwrapped — the line breaks apart</div><div style="font:400 20px/1.75 var(--font-arabic);color:#9AA3B4">افتح Claude Code ثم شغّل /init — لاحظ موضع العلامات.</div></div></div></body></html>
