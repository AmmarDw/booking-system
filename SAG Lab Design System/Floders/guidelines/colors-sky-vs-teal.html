<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--brand-white);font-family:var(--font-arabic);color:var(--brand-ink)}body{padding:18px;box-sizing:border-box}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:10px;padding:10px 12px;min-width:132px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;height:104px}.sw b{font:600 15px/1.2 var(--font-arabic)}.sw code{font:400 12px/1.2 var(--font-mono);direction:ltr;opacity:.85}.row{display:flex;gap:14px;align-items:baseline}.lab{font:400 12px/1 var(--font-mono);color:#7c869b;direction:ltr}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div style="border:1px solid var(--brand-snow-line);border-radius:12px;padding:12px"><div style="height:4px;width:120px;background:var(--brand-sky);border-radius:2px"></div><div style="margin-top:10px;font:600 16px var(--font-arabic);color:var(--brand-primary)">sky — البنية</div><div style="font-size:14px">المساطر، الأزرار، التفاصيل التقنية، النقاط الرصاصية</div></div><div style="border:1px solid var(--brand-snow-line);border-radius:12px;padding:12px"><div style="display:flex;gap:6px"><span style="width:34px;height:10px;border-radius:5px;background:var(--brand-primary)"></span><span style="width:52px;height:10px;border-radius:5px;background:var(--brand-teal)"></span><span style="width:34px;height:10px;border-radius:5px;background:var(--brand-snow-line)"></span></div><div style="margin-top:10px;font:600 16px var(--font-arabic);color:var(--brand-primary)">teal — الحالة</div><div style="font-size:14px">الخطوة الحالية، المنجز، التقدّم</div></div></div></body></html>
